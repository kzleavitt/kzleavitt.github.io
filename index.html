<p>Hermes is a private, personal assistant that Kurt Leavitt runs on his own computer. It reads his own Gmail, Google Calendar and related Google data so it can send him daily summaries and help him stay organized.</p>
<p>It is not offered to the public and is used only by its owner.</p>
